version: '3'

dotenv:
  - .env

env:
  PROJECT_ROOT: '{{.ROOT_DIR}}'

vars:
  APP_NAME: "GC_learn"
  BIN_DIR: "bin"
  BUF_VERSION: "1.75.0"
  PROTOC_GEN_GO_VERSION: "1.36.12"
  PROTOC_GEN_GO_VERSION_GRPC: "1.6.2"
  PROTO_DIR: "shared/proto"

  POSTGRES_URL: "postgres://{{.POSTGRES_USER}}:{{.POSTGRES_PASSWORD}}@zapiski-postgres:5432/{{.POSTGRES_DB}}?sslmode=disable"

tasks:
  docker-up-infra:
    desc: "Поднимает инфраструктуру (postgres, redis, mailhog)"
    cmds:
      - docker compose up -d zapiski-postgres zapiski-redis mailhog

  docker-up-app:
    desc: "Поднимает gateway+SSO и зависимости в Docker Compose"
    cmds:
      - docker compose up -d --build

