syntax = "proto3";

package agent.V1;
import "google/protobuf/struct.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/qury/yourapp/gen/gigachat/agentv1;agentv1";

service AgentService {
    rpc ChatCompletion(ChatRequest) returns (ChatResponse);
    rpc GetChats(GetChatsRequest) returns (GetChatsResponse);
    rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse);
}

message GetMessagesRequest {
  int64 chat_id = 1;
  optional int64 limit = 2;
  optional int64 offset = 3;
}

message GetMessagesResponse {
  repeated Message message = 1;
}

message GetChatsRequest {
  int64 user_id = 1;
  optional int64 limit = 2;
  optional int64 offset = 3;
}

message GetChatsResponse {
  repeated Chat chats = 1;
}

enum ChatMode {
  CHAT_MODE_UNSPECIFIED = 0;
  CHAT_MODE_SUPPORT = 1;
  CHAT_MODE_FULL = 2;
}

message Chat {
  int64 id = 1;
  int64 version = 2;
  ChatMode mode = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  optional google.protobuf.Timestamp deleted_at = 6;
  int64 user_id = 7;
}


// Запрос на генерацию ответа LLM.
message ChatRequest {
  string model = 1;
  repeated Message messages = 2;
  // Максимальное количество генерируемых токенов.
  optional int32 max_tokens = 3;
  // Температура сэмплирования.
  optional double temperature = 4;
  int64 chat_id = 5;
  int64 user_id = 6;
}

message Message {
  int64 id = 1;
  int64 chat_id = 2;
  Role role = 3;
  string content = 4;
  google.protobuf.Timestamp created_at = 5;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_SYSTEM = 1;
  ROLE_USER = 2;
  ROLE_ASSISTANT = 3;
  ROLE_TOOL = 4;
}

// Ответ LLM.
message ChatResponse {
  string thread_id = 1;
  string model = 2;
  string content = 3;

  FinishReason finish_reason = 4;

  Usage usage = 5;
  google.protobuf.Timestamp created_at = 6;
}

enum FinishReason {
  FINISH_REASON_UNSPECIFIED = 0;
  FINISH_REASON_STOP = 1;
  FINISH_REASON_LENGTH = 2;
  FINISH_REASON_TOOL_CALLS = 3;
  FINISH_REASON_CONTENT_FILTER = 4;
}

// Статистика использования токенов.
message Usage {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
  int32 total_tokens = 3;
  int32 cached_tokens = 4;
}
