version: "2"

linters:
  default: standard 
  enable:
    - gocritic      
    - gosec         
    - misspell      
    - revive        
  settings:
    govet:
      enable-all: true
    revive:
      rules:
        - name: exported
          disabled: true 

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
