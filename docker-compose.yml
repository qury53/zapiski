services:
    zapiski-sso:
        build:
            context: .
            dockerfile: sso/cmd/Dockerfile
        image: zapiski-sso:local
        container_name: zapiski-sso
        restart: unless-stopped
        env_file:
        - .env
        environment:
        - POSTGRES_HOST=zapiski-postgres
        - POSTGRES_PORT=5432
        - REDIS_ADDR=zapiski-redis:6379
        - SSO_GRPC_PORT=50051
        - SSO_METRICS_PORT=9091
        expose:
        - "9091"
        ports:
        - "50051:50051"
        depends_on:
        - zapiski-postgres
        - zapiski-redis

    zapiski-agent:
        build:
            context: .
            dockerfile: agent/cmd/Dockerfile
        image: zapiski-agent:local
        container_name: zapiski-agent
        restart: unless-stopped
        env_file:
        - .env
        environment:
        - POSTGRES_HOST=zapiski-postgres
        - POSTGRES_PORT=5432
        - AGENT_GRPC_PORT=5678
        ports:
        - "5678:5678"
        expose:
        - "9092"
        depends_on:
        - zapiski-postgres

    zapiski-postgres:
        image: postgres:18.1-bookworm
        container_name: zapiski-postgres
        restart: always
        environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB}
        volumes:
        - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql

  zapiski-postgres-migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      zapiski-postgres:
        condition: service_healthy
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  zapiski-redis:
    image: redis:8.2-alpine
    container_name: zapiski-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USER: ${REDIS_USER}
      REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - ${PROJECT_ROOT}/out/redisdata:/data
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
        echo "requirepass $REDIS_PASSWORD" >> /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user default on nopass ~* +@all" > /usr/local/etc/redis/users.acl &&
        echo "user $REDIS_USER on >$REDIS_USER_PASSWORD ~* +@all" >> /usr/local/etc/redis/users.acl &&
        redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      '
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  sso:
    build:
      context: .
      dockerfile: deploy/docker/sso.Dockerfile
    container_name: gc-sso
    depends_on:
      zapiski-postgres:
        condition: service_healthy
      zapiski-redis:
        condition: service_healthy
      zapiski-postgres-migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      SSO_GRPC_PORT: ${SSO_GRPC_PORT:-50051}
      SSO_SHUTDOWN_TIME: ${SSO_SHUTDOWN_TIME:-30s}
      POSTGRES_HOST: zapiski-postgres
      POSTGRES_PORT: 5432
      REDIS_ADDR: zapiski-redis:6379
    ports:
      - "${SSO_GRPC_PORT:-50051}:50051"
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: gc-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    container_name: gc-api
    depends_on:
      sso:
        condition: service_started
    env_file:
      - .env
    environment:
      SSO_GRPC_ADDR: sso:50051
      API_HTTP_ADDR: :8080
    ports:
      - "8080:8080"
    restart: unless-stopped

    
    zapiski-redis:
        image: redis:8.10-alpine
        container_name: zapiski-redis
        environment:
        - REDIS_PASSWORD=${REDIS_PASSWORD}
        - REDIS_USER=${REDIS_USER}
        - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}
        ports:
        - "6379:6379"
        volumes:
        - ${PROJECT_ROOT}/out/redisdata:/data
        deploy:
            resources:
                limits:
                    cpus: '0.50'
                    memory: 512M
                reservations:
                    cpus: '0.25'
                    memory: 256M
        command: >
            sh -c '
                mkdir -p /usr/local/etc/redis &&
                echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
                echo "requirepass $REDIS_PASSWORD" >> /usr/local/etc/redis/redis.conf &&
                echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
                echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
                echo "user default on nopass ~* +@all" > /usr/local/etc/redis/users.acl &&
                echo "user $REDIS_USER on >$REDIS_USER_PASSWORD ~* +@all" >> /usr/local/etc/redis/users.acl &&
                redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
            '
        healthcheck:
            test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
            interval: 30s
            timeout: 10s
            retries: ${REDIS_MAX_RETRIES}
        restart: unless-stopped
        tty: true
        stdin_open: true   

networks:
  default:
    name: zapiski-net
    external: true

