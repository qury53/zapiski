services:
    zapiski-sso:
        build:
            context: .
            dockerfile: sso/cmd/Dockerfile
        image: zapiski-sso:local
        container_name: zapiski-sso
        restart: unless-stopped
        env_file:
        - .env
        environment:
        - POSTGRES_HOST=zapiski-postgres
        - POSTGRES_PORT=5432
        - REDIS_ADDR=zapiski-redis:6379
        - SSO_GRPC_PORT=50051
        - SSO_METRICS_PORT=9091
        expose:
        - "9091"
        ports:
        - "50051:50051"
        depends_on:
        - zapiski-postgres
        - zapiski-redis

    zapiski-agent:
        build:
            context: .
            dockerfile: agent/cmd/Dockerfile
        image: zapiski-agent:local
        container_name: zapiski-agent
        restart: unless-stopped
        env_file:
        - .env
        ports:
        - "5678:5678"
        expose:
        - "9092"

    zapiski-postgres:
        image: postgres:18.1-bookworm
        container_name: zapiski-postgres
        restart: always
        environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB}
        volumes:
        - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql

    zapiski-postgres-migrate:
        image: migrate/migrate:v4.19.1
        volumes:
        - ${PROJECT_ROOT}/migrations:/migrations
    
    zapiski-redis:
        image: redis:8.10-alpine
        container_name: zapiski-redis
        environment:
        - REDIS_PASSWORD=${REDIS_PASSWORD}
        - REDIS_USER=${REDIS_USER}
        - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}
        ports:
        - "6379:6379"
        volumes:
        - ${PROJECT_ROOT}/out/redisdata:/data
        deploy:
            resources:
                limits:
                    cpus: '0.50'
                    memory: 512M
                reservations:
                    cpus: '0.25'
                    memory: 256M
        command: >
            sh -c '
                mkdir -p /usr/local/etc/redis &&
                echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
                echo "requirepass $REDIS_PASSWORD" >> /usr/local/etc/redis/redis.conf &&
                echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
                echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
                echo "user default on nopass ~* +@all" > /usr/local/etc/redis/users.acl &&
                echo "user $REDIS_USER on >$REDIS_USER_PASSWORD ~* +@all" >> /usr/local/etc/redis/users.acl &&
                redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
            '
        healthcheck:
            test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
            interval: 30s
            timeout: 10s
            retries: ${REDIS_MAX_RETRIES}
        restart: unless-stopped
        tty: true
        stdin_open: true   

networks:
  default:
    name: zapiski-net
    external: true