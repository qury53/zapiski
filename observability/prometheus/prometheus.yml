global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alloy'
    static_configs:
      - targets: ['alloy:12345']  # Alloy отдаёт свои метрики на этом порту
  
  - job_name: 'sso'
    static_configs:
      - targets: ['zapiski-sso:9091']
    
  - job_name: 'agent'
    static_configs:
      - targets: ['zapiski-agent:9092']